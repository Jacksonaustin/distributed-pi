# Grafana reads this at startup and creates the Prometheus data source.
# PROMETHEUS_URL is set by docker-compose.yml (http://prometheus:9090), or by
# you when running Grafana from Homebrew (http://localhost:9090).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL}
    isDefault: true
    jsonData:
      timeInterval: 2s
