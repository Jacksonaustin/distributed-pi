<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>pi-a Sender</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    .banner { padding: 1.5rem; border-radius: 8px; color: white; font-size: 1.6rem; text-align: center; }
    .ok { background: #2e7d32; }
    .fail { background: #c62828; }
    .offline { background: #616161; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td { padding: 4px 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>pi-a (monitored)</h1>
  <div id="banner" class="banner offline">Loading…</div>

  <table>
    <tr><td>Target</td><td id="target">–</td></tr>
    <tr><td>Current seq</td><td id="seq">–</td></tr>
    <tr><td>Sent OK</td><td id="ok">–</td></tr>
    <tr><td>Send failures</td><td id="failures">–</td></tr>
    <tr><td>Consecutive failures</td><td id="consec">–</td></tr>
    <tr><td>Last error</td><td id="error">–</td></tr>
    <tr><td>Uptime (s)</td><td id="uptime">–</td></tr>
  </table>

  <script>
    async function refresh() {
      const banner = document.getElementById("banner");
      try {
        const s = await (await fetch("/status")).json();
        const ok = s.last_send_ok;
        banner.className = "banner " + (ok ? "ok" : "fail");
        banner.textContent = ok ? "Heartbeats reaching pi-b" : "Cannot reach pi-b";

        document.getElementById("target").textContent = s.target;
        document.getElementById("seq").textContent = s.seq;
        document.getElementById("ok").textContent = s.sent_ok;
        document.getElementById("failures").textContent = s.send_failures;
        document.getElementById("consec").textContent = s.consecutive_failures;
        document.getElementById("error").textContent = s.last_error ?? "–";
        document.getElementById("uptime").textContent = s.uptime_seconds;
      } catch (err) {
        banner.className = "banner offline";
        banner.textContent = "pi-a app is not responding";
      }
    }
    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
